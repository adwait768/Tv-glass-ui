name: 768 Glass OS Android build

on:
  push:
    branches: [ "768-glass-os" ]
    paths: [ "768-glass-os/**", ".github/workflows/768-glass-os.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: 768-glass-os
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 768-glass-os-debug
          path: 768-glass-os/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
